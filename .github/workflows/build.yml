name: Build ZMK Firmware

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix:
        include:
          - board: nice_nano
            shield: totem_max_left
            artifact-name: totem_max_left_nice_nano
          - board: nice_nano
            shield: totem_max_right
            artifact-name: totem_max_right_nice_nano
          - board: xiao_ble//zmk
            shield: "totem_max_dongle prospector_adapter"
            artifact-name: totem_max_dongle_xiao_ble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
            prospector-zmk-module/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: West init & update
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build (${{ matrix.artifact-name }})
        run: |
          west build -b ${{ matrix.board }} -s zmk/app -d "build/${{ matrix.artifact-name }}" -- \
            -DSHIELD="${{ matrix.shield }}" \
            -DZMK_CONFIG="${PWD}/config"

      - name: Rename artifact
        run: |
          mkdir -p artifacts
          cp "build/${{ matrix.artifact-name }}/zephyr/zmk.uf2" \
             "artifacts/${{ matrix.artifact-name }}.uf2"

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/${{ matrix.artifact-name }}.uf2
