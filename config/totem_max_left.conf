# Totem Max (left) — board/shield configuration
#
# MCU: nRF52840 (Nice!Nano v2 compatible)
# Split: BLE wireless split
# ZMK v0.3

# ── ZMK core ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000

# ── BLE ──
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split (dongle is central, this half is peripheral) ──
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
