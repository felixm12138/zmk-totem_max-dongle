# Totem Max (left) — board/shield configuration
#
# MCU: nRF52840 (Nice!Nano v2 compatible)
# Split: BLE wireless peripheral (dongle is central)
# ZMK main (Zephyr 4.1)

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Only the dongle should expose USB HID to the host.
CONFIG_ZMK_USB=n
