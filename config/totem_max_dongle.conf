# Totem Max dongle — board/shield configuration
#
# MCU: nRF52840 (Seeed Studio XIAO BLE)
# This is the BLE central hub that connects to both split halves
# and drives the Prospector LCD display.

# ── ZMK core ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000

# ── BLE — Central role ──
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── ZMK Studio ──
CONFIG_ZMK_STUDIO=y

# ── USB ──
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_HID=y

# ── Battery ──
CONFIG_ZMK_BATTERY_REPORTING=y

# ── Prospector Display ──
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_LVGL=y
CONFIG_LVGL_OBJS=y
