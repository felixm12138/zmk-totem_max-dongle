# Totem Max dongle — board/shield configuration
#
# MCU: nRF52840 (Seeed Studio XIAO BLE)
# ZMK v0.3
# BLE central hub + Prospector LCD display

# ── ZMK core ──
CONFIG_ZMK_SLEEP=y

# ── BLE ──
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split — Central role ──
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# ── Prospector Display ──
CONFIG_ZMK_DISPLAY=y

# Brightness (disable ambient sensor to use fixed value)
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80

# Show battery/connection for both peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2