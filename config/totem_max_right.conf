# Totem Max (right) — board/shield configuration
#
# MCU: nRF52840 (Nice!Nano v2 compatible)
# Split: BLE wireless peripheral (dongle is central)
# ZMK v0.3

# ── ZMK core ──
CONFIG_ZMK_SLEEP=y

# ── BLE ──
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split ──
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# ── USB (disabled — only dongle is USB host) ──
CONFIG_ZMK_USB=n
