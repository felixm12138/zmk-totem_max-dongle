# Totem Max (right) — board/shield configuration
#
# MCU: nRF52840 (Nice!Nano v2 compatible)
# Split: BLE wireless split
# Studio: enabled for runtime remapping

# ── ZMK core ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000

# ── BLE ──
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── Split ──
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
# Right side is NOT central — role auto-detected by USB presence

# ── ZMK Studio ──
CONFIG_ZMK_STUDIO=y

# ── USB ──
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_HID=y

# ── Battery ──
CONFIG_ZMK_BATTERY_REPORTING=y
